# team-desk recommended tmux settings
# Ctrl+Z suspends Claude Code. In a team pane that is easy to hit by mistake (it is "undo" on Windows),
# so map it to Claude's undo (Ctrl+_) instead.
bind -n C-z send-keys C-_
# Click to focus/resize panes, wheel to scroll.
set -g mouse on
# Lead pane on the left, teammates stacked on the right.
set -g main-pane-width 60%
# Faster Escape: team-desk stop and Claude's own Esc handling rely on it.
set -g escape-time 10
